  Automatically downloads trailers for upcoming and recently released movies
  not in your library, from TMDB/YouTube. Pairs with Cinema Mode to create a
  real cinema experience — random trailers before your movies start.
overview: Cinema-style trailers for movies you haven't seen yet
category: General
owner: robadieNZ
targetAbi: 10.11.0.0
changelog:
  - Add: custom trailer languages — an "Other languages" box on the settings page accepts any ISO 639-1 two-letter codes, so languages outside the checkbox list (Czech, Hebrew, Finnish, Ukrainian, …) can now be requested
  - Note: TMDB's language tag is supplied by whoever uploaded the trailer, so a trailer can be labelled one language but have audio in another — the filter is only as accurate as TMDB's metadata

