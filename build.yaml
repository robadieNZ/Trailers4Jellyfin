version: 1.0.20.0
name: Trailers4Jellyfin
guid: 7635bf62-6b22-4c4c-9bc7-5d55f0c2bff0
description: >
  Automatically downloads trailers for upcoming and recently released movies
  not in your library, from TMDB/YouTube. Pairs with Cinema Mode to create a
  real cinema experience — random trailers before your movies start.
overview: Cinema-style trailers for movies you haven't seen yet
category: General
owner: robadieNZ
targetAbi: 10.11.0.0
changelog:
  - Add: pre-roll ads — point the new "Pre-roll Ads" setting at a folder of your own ad clips and they play before the trailers, the way a cinema runs its idents and adverts first. Off by default. Ads play in filename order, and the plugin never downloads, rotates or deletes them. The folder must be added as a Jellyfin Movies library and scanned, same as the trailers folder
  - Add: trailers can now be disabled independently of ads — set trailers per movie to 0 to play only ads
  - Fix: trailer folder matching no longer treats a sibling folder as part of the trailer library (a trailers folder of "/media/Trailers" also matched "/media/TrailersAds")

dotnetProjects:
  - name: Jellyfin.Plugin.Trailers4Jellyfin
    artifact: Jellyfin.Plugin.Trailers4Jellyfin.dll
